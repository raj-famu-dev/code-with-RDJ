<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-labelledby="t d"><title id="t">Pointers and memory at a glance</title><desc id="d">Animated diagram: a stack pointer obtains a heap block with malloc, the block is written and read, then freed and the pointer set to NULL, ending with a clean AddressSanitizer run.</desc><style>.sans{font-family:'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace}</style><defs><linearGradient id="bgm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b18"/><stop offset="0.55" stop-color="#0d1330"/><stop offset="1" stop-color="#150f33"/></linearGradient><pattern id="gridm" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity="0.045" stroke-width="1"/></pattern><filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1000" height="430" rx="16" fill="url(#bgm)"/><rect width="1000" height="430" rx="16" fill="url(#gridm)"/><g class="sans"><text class="mono" x="32" y="44" font-size="13" letter-spacing="3" fill="#a78bfa">POINTERS &amp; MEMORY AT A GLANCE  /  MALLOC → USE → FREE</text><text x="32" y="64" font-size="13" fill="#94a3b8">The stack cleans up after itself. The heap does not — you free every byte you take, then point at nothing.</text></g><rect x="48" y="80" width="400" height="234" rx="12" fill="#0f172a" stroke="#1e293b"/><text class="mono" x="64" y="104" font-size="13" letter-spacing="2" fill="#38bdf8">STACK</text><text x="64" y="121" font-size="11.5" fill="#64748b">automatic storage — the runtime cleans it up</text><rect x="72" y="132" width="352" height="130" rx="8" fill="#0b1220" stroke="#334155"/><text class="mono" x="84" y="152" font-size="11.5" fill="#64748b">main() frame</text><rect x="84" y="160" width="180" height="44" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/><text class="mono" x="96" y="178" font-size="13" fill="#e2e8f0">Node *p</text><text class="mono" x="96" y="196" font-size="12" fill="#64748b">NULL<animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.05;0.06;0.6;0.61;1" dur="10s" repeatCount="indefinite"/></text><text class="mono" x="96" y="196" font-size="12" font-weight="700" fill="#22d3ee" opacity="0">0x1A40<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.05;0.06;0.6;0.61;1" dur="10s" repeatCount="indefinite"/></text><rect x="84" y="212" width="180" height="40" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5"/><text class="mono" x="96" y="230" font-size="13" fill="#e2e8f0">int n</text><text class="mono" x="96" y="246" font-size="12" fill="#94a3b8">3</text><text class="mono" x="276" y="178" font-size="11.5" fill="#64748b">grows ↓, dies at</text><text class="mono" x="276" y="194" font-size="11.5" fill="#64748b">the closing brace</text><rect x="552" y="80" width="400" height="234" rx="12" fill="#0f172a" stroke="#1e293b"/><text class="mono" x="568" y="104" font-size="13" letter-spacing="2" fill="#a78bfa">HEAP</text><text x="568" y="121" font-size="11.5" fill="#64748b">manual storage — you own every byte until free()</text><rect x="660" y="150" width="70" height="36" rx="6" fill="#1e293b" stroke="#334155" opacity="0.55"/><rect x="660" y="198" width="70" height="36" rx="6" fill="#1e293b" stroke="#334155" opacity="0.55"/><text class="mono" x="668" y="172" font-size="10" fill="#475569">in use</text><text class="mono" x="668" y="220" font-size="10" fill="#475569">in use</text><line x1="264" y1="182" x2="782" y2="176" stroke="#22d3ee" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0;0.9;0.9;0;0" keyTimes="0;0.05;0.06;0.6;0.61;1" dur="10s" repeatCount="indefinite"/></line><polygon points="782,170 794,176 782,182" fill="#22d3ee" opacity="0"><animate attributeName="opacity" values="0;0;0.9;0.9;0;0" keyTimes="0;0.05;0.06;0.6;0.61;1" dur="10s" repeatCount="indefinite"/></polygon><text class="mono" x="770" y="140" font-size="11" fill="#22d3ee" opacity="0">0x1A40<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.05;0.06;0.6;0.61;1" dur="10s" repeatCount="indefinite"/></text><g><rect x="770" y="150" width="110" height="52" rx="6" fill="#0f172a" stroke="#a78bfa" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.05;0.06;0.6;0.61;1" dur="10s" repeatCount="indefinite"/></rect><rect x="770" y="150" width="110" height="52" rx="6" fill="#a78bfa" opacity="0" filter="url(#glow)"><animate attributeName="opacity" values="0;0;0.5;0.5;0;0" keyTimes="0;0.05;0.06;0.25;0.27;1" dur="10s" repeatCount="indefinite"/></rect><text class="mono" x="825" y="176" font-size="16" font-weight="700" fill="#fff" text-anchor="middle" opacity="0">42<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.26;0.6;0.61;1" dur="10s" repeatCount="indefinite"/></text><text class="mono" x="825" y="193" font-size="9.5" fill="#a78bfa" text-anchor="middle" opacity="0">4 bytes<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.05;0.06;0.6;0.61;1" dur="10s" repeatCount="indefinite"/></text></g><rect x="770" y="150" width="110" height="52" rx="6" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.63;0.65;0.93;0.96;1" dur="10s" repeatCount="indefinite"/></rect><text class="mono" x="825" y="176" font-size="12" fill="#64748b" text-anchor="middle" opacity="0">freed<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.63;0.65;0.93;0.96;1" dur="10s" repeatCount="indefinite"/></text><text class="mono" x="770" y="222" font-size="10.5" fill="#64748b" opacity="0">p = NULL — never touch it again<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.63;0.65;0.93;0.96;1" dur="10s" repeatCount="indefinite"/></text><rect x="48" y="334" width="904" height="84" rx="8" fill="#0b1220" stroke="#1e293b"/><text class="mono" x="64" y="360" font-size="13" fill="#64748b">$ gcc -std=c17 -Wall -Wextra -Wpedantic -g -fsanitize=address,undefined demo.c &amp;&amp; ./a.out</text><text class="mono" x="64" y="384" font-size="13" fill="#e2e8f0" opacity="0">42<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.45;0.46;0.9;0.94;1" dur="10s" repeatCount="indefinite"/></text><text class="mono" x="88" y="406" font-size="12" fill="#34d399" opacity="0">ASan: 0 errors · 0 leaks — every block freed exactly once<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.75;0.77;0.9;0.94;1" dur="10s" repeatCount="indefinite"/></text></svg>
