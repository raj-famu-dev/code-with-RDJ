<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 270" width="1000" height="270" role="img" aria-labelledby="t d"><title id="t">How a topic is learned</title><desc id="d">Five steps: write, run, break, explain, ship. A topic is marked completed after all five.</desc><style>.sans{font-family:'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace}</style><defs><linearGradient id="bgm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b18"/><stop offset="0.55" stop-color="#0d1330"/><stop offset="1" stop-color="#150f33"/></linearGradient><pattern id="gridm" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity="0.045" stroke-width="1"/></pattern><filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1000" height="270" rx="16" fill="url(#bgm)"/><rect width="1000" height="270" rx="16" fill="url(#gridm)"/><g class="sans"><line x1="100" y1="92" x2="900" y2="92" stroke="#1e293b" stroke-width="4"/><line x1="100" y1="92" x2="900" y2="92" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="5 9"><animate attributeName="stroke-dashoffset" from="0" to="-56" dur="2s" repeatCount="indefinite"/></line><circle cx="100" cy="92" r="36" fill="#34d399" opacity="0"><animate attributeName="opacity" values="0;0;0.18;0.18;0;0" keyTimes="0.0000;0.0400;0.0650;0.2100;0.2350;1.0000" dur="10s" begin="0s" repeatCount="indefinite"/></circle><circle cx="100" cy="92" r="34" fill="#0f172a" stroke="#34d399" stroke-width="2.5"/><text x="100" y="103" font-size="30" font-weight="800" fill="#34d399" text-anchor="middle">1</text><text x="100" y="158" font-size="17" font-weight="800" letter-spacing="2" fill="#e2e8f0" text-anchor="middle">WRITE</text><text x="100" y="180" font-size="13.5" fill="#94a3b8" text-anchor="middle">Type the code.</text><text x="100" y="198" font-size="13.5" fill="#94a3b8" text-anchor="middle">Small and runnable.</text><circle cx="300" cy="92" r="36" fill="#34d399" opacity="0"><animate attributeName="opacity" values="0;0;0.18;0.18;0;0" keyTimes="0.0000;0.2100;0.2350;0.3800;0.4050;1.0000" dur="10s" begin="0s" repeatCount="indefinite"/></circle><circle cx="300" cy="92" r="34" fill="#0f172a" stroke="#34d399" stroke-width="2.5"/><text x="300" y="103" font-size="30" font-weight="800" fill="#34d399" text-anchor="middle">2</text><text x="300" y="158" font-size="17" font-weight="800" letter-spacing="2" fill="#e2e8f0" text-anchor="middle">RUN</text><text x="300" y="180" font-size="13.5" fill="#94a3b8" text-anchor="middle">Run it for real.</text><text x="300" y="198" font-size="13.5" fill="#94a3b8" text-anchor="middle">Paste the real output.</text><circle cx="500" cy="92" r="36" fill="#34d399" opacity="0"><animate attributeName="opacity" values="0;0;0.18;0.18;0;0" keyTimes="0.0000;0.3800;0.4050;0.5500;0.5750;1.0000" dur="10s" begin="0s" repeatCount="indefinite"/></circle><circle cx="500" cy="92" r="34" fill="#0f172a" stroke="#34d399" stroke-width="2.5"/><text x="500" y="103" font-size="30" font-weight="800" fill="#34d399" text-anchor="middle">3</text><text x="500" y="158" font-size="17" font-weight="800" letter-spacing="2" fill="#e2e8f0" text-anchor="middle">BREAK</text><text x="500" y="180" font-size="13.5" fill="#94a3b8" text-anchor="middle">Hit the traps</text><text x="500" y="198" font-size="13.5" fill="#94a3b8" text-anchor="middle">on purpose.</text><circle cx="700" cy="92" r="36" fill="#34d399" opacity="0"><animate attributeName="opacity" values="0;0;0.18;0.18;0;0" keyTimes="0.0000;0.5500;0.5750;0.7200;0.7450;1.0000" dur="10s" begin="0s" repeatCount="indefinite"/></circle><circle cx="700" cy="92" r="34" fill="#0f172a" stroke="#34d399" stroke-width="2.5"/><text x="700" y="103" font-size="30" font-weight="800" fill="#34d399" text-anchor="middle">4</text><text x="700" y="158" font-size="17" font-weight="800" letter-spacing="2" fill="#e2e8f0" text-anchor="middle">EXPLAIN</text><text x="700" y="180" font-size="13.5" fill="#94a3b8" text-anchor="middle">Write the .md,</text><text x="700" y="198" font-size="13.5" fill="#94a3b8" text-anchor="middle">line by line.</text><circle cx="900" cy="92" r="36" fill="#34d399" opacity="0"><animate attributeName="opacity" values="0;0;0.18;0.18;0;0" keyTimes="0.0000;0.7200;0.7450;0.8600;0.8850;1.0000" dur="10s" begin="0s" repeatCount="indefinite"/></circle><circle cx="900" cy="92" r="34" fill="#0f172a" stroke="#34d399" stroke-width="2.5"/><text x="900" y="103" font-size="30" font-weight="800" fill="#34d399" text-anchor="middle">5</text><text x="900" y="158" font-size="17" font-weight="800" letter-spacing="2" fill="#e2e8f0" text-anchor="middle">SHIP</text><text x="900" y="180" font-size="13.5" fill="#94a3b8" text-anchor="middle">Commit it.</text><text x="900" y="198" font-size="13.5" fill="#94a3b8" text-anchor="middle">Mark it completed.</text><circle r="6" fill="#fff" filter="url(#glow)"><animateMotion path="M100,92 L900,92" dur="10s" repeatCount="indefinite"/></circle><rect x="40" y="232" width="920" height="8" rx="4" fill="#34d399" opacity="0.9"/><text class="mono" x="500.0" y="256" font-size="11.5" letter-spacing="1.5" fill="#34d399" text-anchor="middle">COMPLETED = WRITTEN, RUN AND EXPLAINED. THE ORIGIN OF EVERY FILE IS DISCLOSED.</text></g></svg>
