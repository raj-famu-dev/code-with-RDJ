<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-labelledby="t d"><title id="t">Planned pipeline</title><desc id="d">Five planned stages from wake phrase to spoken reply: wake word, speech to text, language model, tools, text to speech. None are built yet.</desc><style>.sans{font-family:'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace}</style><defs><linearGradient id="bgp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b18"/><stop offset="0.55" stop-color="#0d1330"/><stop offset="1" stop-color="#150f33"/></linearGradient><pattern id="gridp" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity="0.045" stroke-width="1"/></pattern><linearGradient id="barp" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#22d3ee"/></linearGradient><filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1000" height="330" rx="16" fill="url(#bgp)"/><rect width="1000" height="330" rx="16" fill="url(#gridp)"/><g class="sans"><text class="mono" x="32" y="44" font-size="13" letter-spacing="3" fill="#22d3ee">PLANNED PIPELINE  /  5 STAGES  /  0 BUILT</text></g><rect x="32" y="92" width="162" height="150" rx="12" fill="#0f172a" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 5"/><g class="sans"><text class="mono" x="48" y="126" font-size="12" letter-spacing="2" fill="#a78bfa">STAGE 1</text><text x="48" y="164" font-size="26" font-weight="800" fill="#fff">WAKE</text><text x="48" y="192" font-size="14" fill="#cbd5e1">“Hey, JARVIS”</text><text class="mono" x="48" y="214" font-size="11" fill="#94a3b8">keyword spotting</text></g><circle cx="174" cy="116" r="5" fill="#6b7280"><animate attributeName="opacity" values="1;0.3;1" dur="2.0s" repeatCount="indefinite"/></circle><path d="M197 167 h14 m-5 -5 l5 5 l-5 5" fill="none" stroke="#22d3ee" stroke-width="2"/><rect x="216" y="92" width="162" height="150" rx="12" fill="#0f172a" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 5"/><g class="sans"><text class="mono" x="232" y="126" font-size="12" letter-spacing="2" fill="#a78bfa">STAGE 2</text><text x="232" y="164" font-size="26" font-weight="800" fill="#fff">LISTEN</text><text x="232" y="192" font-size="14" fill="#cbd5e1">Speech → text</text><text class="mono" x="232" y="214" font-size="11" fill="#94a3b8">local or API STT</text></g><circle cx="358" cy="116" r="5" fill="#6b7280"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></circle><path d="M381 167 h14 m-5 -5 l5 5 l-5 5" fill="none" stroke="#22d3ee" stroke-width="2"/><rect x="400" y="92" width="162" height="150" rx="12" fill="#0f172a" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 5"/><g class="sans"><text class="mono" x="416" y="126" font-size="12" letter-spacing="2" fill="#a78bfa">STAGE 3</text><text x="416" y="164" font-size="26" font-weight="800" fill="#fff">THINK</text><text x="416" y="192" font-size="14" fill="#cbd5e1">LLM + persona</text><text class="mono" x="416" y="214" font-size="11" fill="#94a3b8">prompt + memory</text></g><circle cx="542" cy="116" r="5" fill="#6b7280"><animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite"/></circle><path d="M565 167 h14 m-5 -5 l5 5 l-5 5" fill="none" stroke="#22d3ee" stroke-width="2"/><rect x="584" y="92" width="162" height="150" rx="12" fill="#0f172a" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 5"/><g class="sans"><text class="mono" x="600" y="126" font-size="12" letter-spacing="2" fill="#a78bfa">STAGE 4</text><text x="600" y="164" font-size="26" font-weight="800" fill="#fff">ACT</text><text x="600" y="192" font-size="14" fill="#cbd5e1">Tools</text><text class="mono" x="600" y="214" font-size="11" fill="#94a3b8">allow-listed only</text></g><circle cx="726" cy="116" r="5" fill="#6b7280"><animate attributeName="opacity" values="1;0.3;1" dur="3.2s" repeatCount="indefinite"/></circle><path d="M749 167 h14 m-5 -5 l5 5 l-5 5" fill="none" stroke="#22d3ee" stroke-width="2"/><rect x="768" y="92" width="162" height="150" rx="12" fill="#0f172a" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 5"/><g class="sans"><text class="mono" x="784" y="126" font-size="12" letter-spacing="2" fill="#a78bfa">STAGE 5</text><text x="784" y="164" font-size="26" font-weight="800" fill="#fff">SPEAK</text><text x="784" y="192" font-size="14" fill="#cbd5e1">Text → speech</text><text class="mono" x="784" y="214" font-size="11" fill="#94a3b8">spoken reply</text></g><circle cx="910" cy="116" r="5" fill="#6b7280"><animate attributeName="opacity" values="1;0.3;1" dur="3.6s" repeatCount="indefinite"/></circle><g class="sans"><text x="32" y="292" font-size="14" fill="#cbd5e1">Every stage is not started. A stage turns green only when it runs and has proof.</text></g></svg>