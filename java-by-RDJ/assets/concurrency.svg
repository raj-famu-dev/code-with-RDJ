<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 392" width="1000" height="392" role="img" aria-labelledby="t d"><title id="t">A lost update in count++</title><desc id="d">Two threads interleave read and write steps on a shared counter without a lock, producing 1 instead of 2; with a lock the result is 2.</desc><style>.sans{font-family:'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace}</style><defs><linearGradient id="bgc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b18"/><stop offset="0.55" stop-color="#0d1330"/><stop offset="1" stop-color="#150f33"/></linearGradient><pattern id="gridc" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity="0.045" stroke-width="1"/></pattern><filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1000" height="392" rx="16" fill="url(#bgc)"/><rect width="1000" height="392" rx="16" fill="url(#gridc)"/><g class="sans"><text class="mono" x="32" y="44" font-size="13" letter-spacing="3" fill="#f89820">WHY count++ IS NOT ONE STEP  /  MODULE 05</text><text x="32" y="68" font-size="14" fill="#94a3b8">It is read, add, write. Two threads can interleave those steps and lose an update.</text><text x="32" y="92" font-size="15" font-weight="700" fill="#fb7185">Unsafe: no lock</text><text class="mono" x="32" y="135" font-size="12.5" fill="#94a3b8">Thread 1</text><line x1="120" y1="130" x2="780" y2="130" stroke="#1e293b" stroke-dasharray="3 5"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0923;0.1115;0.8615;0.8808;1.0000" dur="13.0s" begin="0s" repeatCount="indefinite"/><rect x="205" y="114" width="126" height="32" rx="8" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8" stroke-opacity="0.8"/><text class="mono" x="268.0" y="135" font-size="11.5" font-weight="700" fill="#38bdf8" text-anchor="middle">READ 0</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2769;0.2962;0.8615;0.8808;1.0000" dur="13.0s" begin="0s" repeatCount="indefinite"/><rect x="481" y="114" width="126" height="32" rx="8" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8" stroke-opacity="0.8"/><text class="mono" x="544.0" y="135" font-size="11.5" font-weight="700" fill="#38bdf8" text-anchor="middle">WRITE 1</text></g><text class="mono" x="32" y="185" font-size="12.5" fill="#94a3b8">Thread 2</text><line x1="120" y1="180" x2="780" y2="180" stroke="#1e293b" stroke-dasharray="3 5"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1846;0.2038;0.8615;0.8808;1.0000" dur="13.0s" begin="0s" repeatCount="indefinite"/><rect x="343" y="164" width="126" height="32" rx="8" fill="#a78bfa" fill-opacity="0.18" stroke="#a78bfa" stroke-opacity="0.8"/><text class="mono" x="406.0" y="185" font-size="11.5" font-weight="700" fill="#a78bfa" text-anchor="middle">READ 0</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3692;0.3885;0.8615;0.8808;1.0000" dur="13.0s" begin="0s" repeatCount="indefinite"/><rect x="619" y="164" width="126" height="32" rx="8" fill="#a78bfa" fill-opacity="0.18" stroke="#a78bfa" stroke-opacity="0.8"/><text class="mono" x="682.0" y="185" font-size="11.5" font-weight="700" fill="#a78bfa" text-anchor="middle">WRITE 1</text></g><rect x="818" y="98" width="150" height="110" rx="12" fill="#0f172a" stroke="#1e293b"/><text class="mono" x="893" y="120" font-size="11" letter-spacing="2" fill="#64748b" text-anchor="middle">SHARED count</text><text x="893" y="164" font-size="42" font-weight="800" fill="#e2e8f0" text-anchor="middle" opacity="0">0<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0001;0.0115;0.2769;0.2885;1.0000" dur="13.0s" begin="0s" repeatCount="indefinite"/></text><text x="893" y="164" font-size="42" font-weight="800" fill="#e2e8f0" text-anchor="middle" opacity="0">1<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.2769;0.2885;1.0000;1.0000" dur="13.0s" begin="0s" repeatCount="indefinite"/></text><text x="893" y="194" font-size="12" font-weight="800" fill="#fb7185" text-anchor="middle" opacity="0">expected 2: LOST UPDATE<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4769;0.5000;0.8615;0.8846;1.0000" dur="13.0s" begin="0s" repeatCount="indefinite"/></text><text x="32" y="236" font-size="15" font-weight="700" fill="#34d399">Safe: synchronized or AtomicInteger</text><text class="mono" x="32" y="279" font-size="12.5" fill="#94a3b8">Thread 1</text><line x1="120" y1="274" x2="780" y2="274" stroke="#1e293b" stroke-dasharray="3 5"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0923;0.1115;0.8615;0.8808;1.0000" dur="13.0s" begin="0s" repeatCount="indefinite"/><rect x="205" y="258" width="126" height="32" rx="8" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8" stroke-opacity="0.8"/><text class="mono" x="268.0" y="279" font-size="11.5" font-weight="700" fill="#38bdf8" text-anchor="middle">LOCK + READ 0</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1846;0.2038;0.8615;0.8808;1.0000" dur="13.0s" begin="0s" repeatCount="indefinite"/><rect x="343" y="258" width="126" height="32" rx="8" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8" stroke-opacity="0.8"/><text class="mono" x="406.0" y="279" font-size="11.5" font-weight="700" fill="#38bdf8" text-anchor="middle">WRITE 1 + UNLOCK</text></g><text class="mono" x="32" y="329" font-size="12.5" fill="#94a3b8">Thread 2</text><line x1="120" y1="324" x2="780" y2="324" stroke="#1e293b" stroke-dasharray="3 5"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0923;0.1115;0.8615;0.8808;1.0000" dur="13.0s" begin="0s" repeatCount="indefinite"/><rect x="205" y="308" width="264" height="32" rx="8" fill="#475569" fill-opacity="0.1" stroke="#475569" stroke-opacity="0.8" stroke-dasharray="5 4"/><text class="mono" x="337.0" y="329" font-size="11.5" font-weight="700" fill="#94a3b8" text-anchor="middle">BLOCKED: waiting for the lock</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2769;0.2962;0.8615;0.8808;1.0000" dur="13.0s" begin="0s" repeatCount="indefinite"/><rect x="481" y="308" width="126" height="32" rx="8" fill="#a78bfa" fill-opacity="0.18" stroke="#a78bfa" stroke-opacity="0.8"/><text class="mono" x="544.0" y="329" font-size="11.5" font-weight="700" fill="#a78bfa" text-anchor="middle">READ 1</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3692;0.3885;0.8615;0.8808;1.0000" dur="13.0s" begin="0s" repeatCount="indefinite"/><rect x="619" y="308" width="126" height="32" rx="8" fill="#a78bfa" fill-opacity="0.18" stroke="#a78bfa" stroke-opacity="0.8"/><text class="mono" x="682.0" y="329" font-size="11.5" font-weight="700" fill="#a78bfa" text-anchor="middle">WRITE 2</text></g><rect x="818" y="242" width="150" height="110" rx="12" fill="#0f172a" stroke="#1e293b"/><text class="mono" x="893" y="264" font-size="11" letter-spacing="2" fill="#64748b" text-anchor="middle">SHARED count</text><text x="893" y="308" font-size="42" font-weight="800" fill="#e2e8f0" text-anchor="middle" opacity="0">0<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0001;0.0115;0.1846;0.1962;1.0000" dur="13.0s" begin="0s" repeatCount="indefinite"/></text><text x="893" y="308" font-size="42" font-weight="800" fill="#e2e8f0" text-anchor="middle" opacity="0">1<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1846;0.1962;0.3692;0.3808;1.0000" dur="13.0s" begin="0s" repeatCount="indefinite"/></text><text x="893" y="308" font-size="42" font-weight="800" fill="#e2e8f0" text-anchor="middle" opacity="0">2<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.3692;0.3808;1.0000;1.0000" dur="13.0s" begin="0s" repeatCount="indefinite"/></text><text x="893" y="338" font-size="12" font-weight="800" fill="#34d399" text-anchor="middle" opacity="0">correct: 2<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4769;0.5000;0.8615;0.8846;1.0000" dur="13.0s" begin="0s" repeatCount="indefinite"/></text><text class="mono" x="32" y="378" font-size="11" fill="#64748b">Illustrative schedule. 05-multithreading runs the real race; its output is timing-dependent, which the .md says.</text></g></svg>
